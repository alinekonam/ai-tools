<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کل ابزارهای هوش مصنوعی</title>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#656d76;--line:#d0d7de;--head:#f6f8fa;--accent:#1a7f37;--hover:#eef6ff;--btn:#0969da}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--line:#30363d;--head:#161b22;--accent:#3fb950;--hover:#161b22;--btn:#58a6ff}}
:root[data-theme="dark"]{--bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--line:#30363d;--head:#161b22;--accent:#3fb950;--hover:#161b22;--btn:#58a6ff}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Tahoma,"Vazirmatn",system-ui,sans-serif;font-size:14px;line-height:1.6}
header{padding:14px 16px 8px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--muted);font-size:12px;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px;align-items:center}
input[type=search]{flex:1 1 200px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
select{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.count{color:var(--muted);font-size:12px}
.wrap{overflow-x:auto;margin:0 16px 16px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--head);position:sticky;top:0;cursor:pointer;user-select:none}
th:first-child,td:first-child{border-right:none}
tr:hover td{background:var(--hover)}
td.num{color:var(--muted);width:50px;text-align:center}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--line)}
.free{color:var(--accent);border-color:var(--accent)}
.paid{color:#cf222e;border-color:#cf222e}
.fm{color:var(--btn);border-color:var(--btn)}
a.go{color:#fff;background:var(--btn);padding:4px 12px;border-radius:6px;text-decoration:none;font-size:13px}
footer{color:var(--muted);font-size:12px;padding:0 16px 24px}
.sb{padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--head);color:var(--fg);font:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
[hidden]{display:none!important}
header{background:#1f2a5a;color:#fff;padding:12px 16px 14px;text-align:center;margin:0}
header .sub{color:#c9d2f5;margin:0}
.menubar{display:flex;justify-content:space-between;align-items:center;gap:8px;direction:rtl}
.menubar button{background:#fff;color:#1f2a5a;border:0;border-radius:6px;padding:4px 10px;font:inherit;cursor:pointer}
.ed{position:relative}
#edmenu{position:absolute;top:110%;right:0;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;min-width:210px;z-index:20;padding:4px;box-shadow:0 4px 12px rgba(0,0,0,.2);text-align:right}
#edmenu button{display:block;width:100%;text-align:right;background:none;color:var(--fg);padding:8px 10px;border:0;font:inherit;cursor:pointer}
#edmenu button:hover{background:var(--hover)}
.clock{font-size:12px;color:#c9d2f5}
#emblem{height:64px;display:block;margin:0 auto 6px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 0;margin:0}
.tabs.cats{padding-top:6px;padding-bottom:6px;border-bottom:1px solid var(--line);margin:0 0 4px}
.tabs button{background:var(--head);color:var(--fg);border:1px solid var(--line);border-radius:8px 8px 0 0;padding:6px 14px;font:inherit;cursor:pointer}
.tabs button.on{background:#1f2a5a;color:#fff;border-color:#1f2a5a}
</style>

const TAG = {"رایگان":"free","فریمیوم":"fm","پولی":"paid"};
let sortKey = null, asc = true;
const body = document.getElementById("body");
const count = document.getElementById("count");
function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const p = document.getElementById("price").value;
  let rows = SRC().map((r,i)=>({i:i+1,name:r[0],company:r[1],price:r[2],cat:r[3],url:r[4]}));
  rows = rows.filter(r => (!p || r.price===p) && (!CAT || r.cat.includes(CAT)) && (!q || [r.name,r.company,r.cat].join(" ").toLowerCase().includes(q)));
  if(sortKey && sortKey!=="none"){
    rows.sort((a,b)=>{const x=a[sortKey],y=b[sortKey];return (x>y?1:x<y?-1:0)*(asc?1:-1);});
  }
  body.innerHTML = rows.map(r=>`<tr>
    <td class="num">${r.i}</td>
    <td><strong>${esc(r.name)}</strong></td>
    <td>${esc(r.company)}</td>
    <td><span class="tag ${TAG[r.price]}">${r.price}</span></td>
    <td>${esc(r.cat)}</td>
    <td dir="ltr" style="text-align:left;font-family:monospace;font-size:12px">${esc(r.url)}</td>
    <td><a class="go" href="${r.url}" target="_blank" rel="noopener noreferrer">ورود</a> <button type="button" class="sb" data-u="${esc(r.url)}" onclick="copyUrl(this)">کپی</button> <a class="sb" href="sms:?body=${encodeURIComponent(r.name + ' - ' + r.url)}">پیامک</a></td>
  </tr>`).join("");
  count.textContent = rows.length + " ابزار";
}
function copyUrl(btn){
  const u = btn.dataset.u;
  navigator.clipboard.writeText(u).then(()=>{
    btn.textContent = "کپی شد";
    setTimeout(()=>{ btn.textContent = "کپی"; }, 1500);
  }).catch(()=>{ prompt("این آدرس را کپی کنید:", u); });
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
document.querySelectorAll("th[data-k]").forEach(th=>{
  th.addEventListener("click",()=>{
    const k = th.dataset.k;
    if(k==="none") return;
    if(sortKey===k) asc=!asc; else {sortKey=k; asc=true;}
    render();
  });
});
document.getElementById("q").addEventListener("input",render);
document.getElementById("price").addEventListener("change",render);

async function shareSite(){
  const data = {title:"کل ابزارهای هوش مصنوعی", text:"فهرست ابزارهای هوش مصنوعی", url:SITE_URL};
  try {
    if (navigator.share) { await navigator.share(data); return; }
  } catch(e) { return; }
  try {
    await navigator.clipboard.writeText(SITE_URL);
    alert("لینک کپی شد. آن را برای هر کسی که می‌خواهید بفرستید.");
  } catch(e) {
    prompt("این لینک را کپی کنید:", SITE_URL);
  }
}
